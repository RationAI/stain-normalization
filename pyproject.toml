[project]
name = "rationai-staining"
version = "0.1.0"
description = ""
authors = [{ name = "Tomáš Balák" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26.4",
    "pillow>=10.3.0",
    "scikit-image>=0.23.2",
]

[tool.pdm.dev-dependencies]
dev = ["mypy", "pre-commit", "ruff"]
test = ["pytest", "pytest-cov", "perlin-noise>=1.12"]

[tool.pdm.scripts]
l = { composite = ["lint", "format", "mypy"] }
test = "pytest tests"
lint = "ruff check --fix"
format = "ruff format"
mypy = "mypy ."
post_install = { composite = [
    "pre-commit autoupdate",
    "pre-commit install",
    "pre-commit install --hook-type commit-msg",
] }
