defaults:
  - hydra: default
  - logger: mlflow
  - /data/datasets@data.train: stain_normalization/train
  - /data/datasets@data.val: stain_normalization/val
  - /data/datasets@data.test: stain_normalization/test
  - /data/datasets@data.predict: stain_normalization/predict
  - _self_

seed: ${random_seed:}
mode: fit
checkpoint: null


callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    save_top_k: 1
    save_last: true
    monitor: validation/loss
    mode: min

  # opt-in callbacks — add to trainer.callbacks when needed
  tiles_export:
    _target_: stain_normalization.callbacks.TilesExport
    output_dir: ${output_dir}
    n_first: 10
    sample_rate: 0.0005  # for test dataset cca 100 tiles

  analysis_export:
    _target_: stain_normalization.callbacks.AnalysisExport
    output_dir: ${output_dir}

  wsi_assembler:
    _target_: stain_normalization.callbacks.WSIAssembler
    output_dir: ${output_dir}

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/loss
    patience: 5
    mode: min

model:
  lr: 1e-4
  lambda_dssim: 0.6
  lambda_l1: 0.2
  lambda_lum: 0.2
  lambda_gdl: 0.1
  normalize_mean: ${data.test.normalize.mean}
  normalize_std: ${data.test.normalize.std}

trainer:
  enable_checkpointing: True
  max_epochs: 100
  limit_train_batches: 5000
  log_every_n_steps: 50

  callbacks:
    - ${callbacks.model_checkpoint}
    - ${callbacks.early_stopping}

data:
  batch_size: 64
  num_workers: 8

metadata:
  user: ???
  experiment_name: Stain-Normalization
  run_name: ??? 
  description: ???
  hyperparams: ${model}


output_dir: ??? # ./data/outputs

